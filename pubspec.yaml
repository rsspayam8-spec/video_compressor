name: video_compressor
description: "فشرده‌سازی ویدئو - کاهش حجم ویدئو با بالاترین کیفیت، بدون تبلیغات"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # موتور پردازش: نسخه min-gpl = هسته کوچک FFmpeg + کدک‌های x264/x265
  ffmpeg_kit_flutter_new_min_gpl: ^2.6.2

  # انتخاب فایل و مسیرها
  file_picker: ^12.0.0
  path_provider: ^2.1.4

  # پخش، اشتراک‌گذاری و ذخیره در گالری
  video_player: ^2.9.2
  share_plus: ^13.0.0
  gal: ^2.3.0

  # ابزارها
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0DB0B0"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  remove_alpha_ios: true
