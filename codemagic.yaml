workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - video_compressor_keystore
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate launcher icons
        script: dart run flutter_launcher_icons || true

      - name: Match NDK version
        script: |
          NDK_DIR="$ANDROID_SDK_ROOT/ndk"
          if [ -d "$NDK_DIR" ]; then
            LATEST_NDK=$(ls "$NDK_DIR" | sort -V | tail -n 1)
            if [ -n "$LATEST_NDK" ]; then
              sed -i "" "s/ndkVersion = \".*\"/ndkVersion = \"$LATEST_NDK\"/" android/app/build.gradle.kts || \
              sed -i "s/ndkVersion = \".*\"/ndkVersion = \"$LATEST_NDK\"/" android/app/build.gradle.kts
              echo "Using NDK: $LATEST_NDK"
            fi
          fi

      - name: Set up key.properties
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF

      # ساخت APK جداگانه برای هر معماری — حجم هر فایل تقریباً نصف
      # نسخه universal می‌شود. برای مایکت فایل arm64-v8a را آپلود کنید.
      - name: Build APK (attempt 1 - downloads FFmpeg aar)
        script: flutter build apk --release --split-per-abi || true

      - name: Build APK (final)
        script: flutter build apk --release --split-per-abi

      - name: Report APK sizes
        script: |
          echo "================ APK SIZES ================"
          ls -lh build/app/outputs/flutter-apk/*.apk
          echo "=========================================="

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
