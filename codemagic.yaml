workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 90
    instance_type: linux_x2
    environment:
      android_signing:
        - video_compressor_keystore   # باید دقیقاً همین اسم را در Codemagic بدهید
      vars:
        PACKAGE_NAME: "ir.videotools.compressor"
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate launcher icons
        script: dart run flutter_launcher_icons || true

      # نسخه NDK را با نسخه‌ای که روی سرور Codemagic نصب است هماهنگ می‌کند
      - name: Match NDK version
        script: |
          NDK_DIR="$ANDROID_SDK_ROOT/ndk"
          if [ -d "$NDK_DIR" ]; then
            LATEST_NDK=$(ls "$NDK_DIR" | sort -V | tail -n 1)
            if [ -n "$LATEST_NDK" ]; then
              sed -i "s/ndkVersion = \".*\"/ndkVersion = \"$LATEST_NDK\"/" android/app/build.gradle.kts
              echo "Using NDK: $LATEST_NDK"
            fi
          fi

      # ساخت فایل key.properties از مقادیر امن Codemagic
      - name: Set up key.properties
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF

      # پکیج FFmpeg بار اول یک فایل aar دانلود می‌کند و ممکن است شکست بخورد؛
      # بار دوم مطمئناً موفق می‌شود. این رفتار شناخته‌شده خود پکیج است.
      - name: Build APK (attempt 1 - may fail, downloads FFmpeg aar)
        script: flutter build apk --release || true

      - name: Build APK (final)
        script: flutter build apk --release

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
